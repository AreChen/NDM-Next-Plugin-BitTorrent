[package]
name = "ndm-bittorrent-engine"
version = "0.1.2"
edition = "2024"
rust-version = "1.100"
license = "MIT"

[dependencies]
anyhow = "1"
librqbit = { version = "9.1.0", default-features = false, features = ["rust-tls"] }
ndm-plugin-sdk = { git = "https://github.com/AreChen/NDM-Next.git", rev = "963c9d78cf4d307ecf45646949302f7c404cf4a5" }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "time"] }

[profile.release]
strip = "symbols"
lto = "thin"
